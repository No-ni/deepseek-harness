name: Build macOS ARM64 Desktop

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Full desktop version
        required: true
        default: 0.2.1-alpha.2
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned macOS ARM64 app
        run: pnpm run package:desktop:mac:arm64:unsigned -- --build-version "${{ inputs.build_version }}"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-arm64-${{ inputs.build_version }}
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7
